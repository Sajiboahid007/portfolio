<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="rrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="rrCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="geminiSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#090d16" rx="16"/>
  <rect x="2" y="2" width="596" height="346" fill="url(#rrCardGrad)" rx="14" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#312e81" stroke-width="1" stroke-opacity="0.25">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="120" y1="0" x2="120" y2="350" />
    <line x1="240" y1="0" x2="240" y2="350" />
    <line x1="360" y1="0" x2="360" y2="350" />
    <line x1="480" y1="0" x2="480" y2="350" />
  </g>

  <!-- Glowing background ambient light -->
  <circle cx="300" cy="130" r="90" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Main Research Document / Journal Card -->
  <g transform="translate(130, 45)">
    <!-- Back Page Shadow -->
    <rect x="15" y="10" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.6"/>
    <!-- Front Journal Page -->
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    
    <!-- Academic Cap / University Header -->
    <rect x="15" y="15" width="30" height="30" rx="6" fill="#4f46e5" fill-opacity="0.3"/>
    <path d="M 30 20 L 40 26 L 30 32 L 20 26 Z" fill="#818cf8"/>
    <path d="M 23 28 L 23 35 C 23 37 37 37 37 35 L 37 28" fill="none" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Document title lines -->
    <rect x="55" y="18" width="125" height="8" rx="4" fill="#f8fafc" opacity="0.9"/>
    <rect x="55" y="32" width="85" height="6" rx="3" fill="#818cf8" opacity="0.8"/>

    <!-- Content mock lines -->
    <rect x="15" y="58" width="170" height="5" rx="2.5" fill="#334155"/>
    <rect x="15" y="70" width="150" height="5" rx="2.5" fill="#334155"/>
    <rect x="15" y="82" width="165" height="5" rx="2.5" fill="#334155"/>
    <rect x="15" y="94" width="110" height="5" rx="2.5" fill="#334155"/>

    <!-- Status Badges inside document -->
    <!-- Peer-Review Approved Badge -->
    <rect x="15" y="112" width="82" height="22" rx="5" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <circle cx="26" cy="123" r="4" fill="#10b981"/>
    <text x="35" y="127" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#34d399">PEER-REVIEWED</text>

    <!-- Defense Approved Badge -->
    <rect x="103" y="112" width="82" height="22" rx="5" fill="#312e81" fill-opacity="0.5" stroke="#818cf8" stroke-width="1"/>
    <text x="144" y="127" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#c7d2fe" text-anchor="middle">DEFENSE REPO</text>
  </g>

  <!-- Gemini AI Plagiarism Verification Widget -->
  <g transform="translate(345, 55)">
    <rect x="0" y="0" width="125" height="60" rx="8" fill="#18181b" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="9" fill="url(#geminiSparkle)"/>
    <path d="M 20 16 L 21 20 L 25 21 L 21 22 L 20 26 L 19 22 L 15 21 L 19 20 Z" fill="#ffffff"/>
    <text x="35" y="22" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#e9d5ff">Gemini AI</text>
    <text x="35" y="32" font-family="Inter, sans-serif" font-size="8" fill="#a1a1aa">Plagiarism Check</text>
    
    <!-- Originality Score Bar -->
    <rect x="12" y="42" width="100" height="6" rx="3" fill="#27272a"/>
    <rect x="12" y="42" width="94" height="6" rx="3" fill="#10b981"/>
    <text x="85" y="40" font-family="JetBrains Mono, monospace" font-size="8" font-weight="bold" fill="#34d399">98% Unique</text>
  </g>

  <!-- Prisma / MySQL Database node -->
  <g transform="translate(345, 128)">
    <rect x="0" y="0" width="125" height="52" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <path d="M 20 18 C 20 15 32 15 32 18 C 32 21 20 21 20 18 Z M 20 23 C 20 26 32 26 32 23 M 20 28 C 20 31 32 31 32 28" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="38" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">Prisma + MySQL</text>
    <text x="38" y="37" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">ACID Transactions</text>
  </g>

  <!-- Connecting data pulse line -->
  <line x1="330" y1="120" x2="345" y2="120" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Footer Project Details -->
  <text x="300" y="278" font-family="Outfit, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">Institutional Research Repository</text>
  <text x="300" y="306" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Peer-Review Journal Management • Gemini AI Verification • Prisma ORM &amp; MySQL</text>
</svg>
