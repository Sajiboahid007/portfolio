<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="otGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="otCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c182c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070d18" stop-opacity="0.95" />
    </linearGradient>
    <filter id="otGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#080e1a" rx="16"/>
  <rect x="2" y="2" width="596" height="346" fill="url(#otCardGrad)" rx="14" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.3">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
  </g>

  <circle cx="200" cy="120" r="80" fill="#3b82f6" opacity="0.08" filter="url(#otGlow)"/>

  <!-- Left: Shift Clock & Overtime Calculator -->
  <g transform="translate(70, 35)">
    <rect x="0" y="0" width="225" height="175" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="10" y="10" width="205" height="24" rx="4" fill="#0369a1" fill-opacity="0.4"/>
    <text x="18" y="26" font-family="Outfit, sans-serif" font-size="10" font-weight="bold" fill="#bae6fd">Shift &amp; Overtime Log</text>
    <circle cx="195" cy="22" r="4" fill="#38bdf8"/>

    <!-- Clock / Timer Icon & Shift Range -->
    <g transform="translate(10, 42)">
      <!-- Clock dial -->
      <circle cx="26" cy="26" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 26 12 L 26 26 L 36 26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="26" cy="26" r="2.5" fill="#ffffff"/>

      <g transform="translate(56, 4)">
        <text x="0" y="12" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">Regular Shift (8 hrs):</text>
        <text x="0" y="24" font-family="JetBrains Mono, monospace" font-size="9" font-weight="bold" fill="#f8fafc">08:00 AM - 04:00 PM</text>
        
        <rect x="0" y="29" width="138" height="18" rx="3" fill="#b45309" fill-opacity="0.3" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="6" y="41" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="bold" fill="#fbbf24">OT: 04:00 PM - 07:30 PM (+3.5h)</text>
      </g>
    </g>

    <!-- Calculation row -->
    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="205" height="66" rx="6" fill="#1e293b"/>
      
      <text x="8" y="18" font-family="Inter, sans-serif" font-size="8" fill="#cbd5e1">Hourly Rate: ৳ 120/hr</text>
      <text x="120" y="18" font-family="Inter, sans-serif" font-size="8" fill="#cbd5e1">OT Rate: 1.5x</text>

      <line x1="8" y1="28" x2="197" y2="28" stroke="#334155" stroke-width="1"/>

      <text x="8" y="44" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">Today's Total Earned:</text>
      <text x="8" y="58" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#34d399">৳ 1,590.00</text>

      <rect x="125" y="36" width="70" height="22" rx="4" fill="#047857"/>
      <text x="160" y="50" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">LOGGED</text>
    </g>
  </g>

  <!-- Right: Monthly Summary & SQLite Offline Storage Card -->
  <g transform="translate(315, 35)">
    <rect x="0" y="0" width="215" height="175" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="12" y="12" width="191" height="26" rx="4" fill="#065f46" fill-opacity="0.4"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="9.5" font-weight="bold" fill="#a7f3d0">MONTHLY WAGE LEDGER</text>
    <rect x="135" y="16" width="60" height="18" rx="3" fill="#047857"/>
    <text x="165" y="28" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">AUGUST</text>

    <!-- Monthly Stats -->
    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="191" height="26" rx="4" fill="#1e293b"/>
      <text x="8" y="17" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">Total Working Days</text>
      <text x="155" y="17" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="bold" fill="#f8fafc">24 Days</text>

      <rect x="0" y="32" width="191" height="26" rx="4" fill="#1e293b"/>
      <text x="8" y="49" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">Accumulated OT Hours</text>
      <text x="155" y="49" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="bold" fill="#fbbf24">52.5 hrs</text>

      <rect x="0" y="64" width="191" height="26" rx="4" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="0.8"/>
      <text x="8" y="81" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#a7f3d0">Estimated Month Pay</text>
      <text x="135" y="81" font-family="JetBrains Mono, monospace" font-size="9" font-weight="bold" fill="#34d399">৳ 38,250</text>
    </g>

    <!-- Android SQLite Offline Badge -->
    <g transform="translate(12, 145)">
      <rect x="0" y="0" width="191" height="20" rx="3" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.6"/>
      <text x="95" y="13" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#c7d2fe" text-anchor="middle">OFFLINE SQLITE • NO INTERNET REQ</text>
    </g>
  </g>

  <!-- Footer Project Details -->
  <text x="300" y="278" font-family="Outfit, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">Daily Work &amp; Overtime Wage Calculator</text>
  <text x="300" y="306" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Daily Shift Hours • Overtime Rate Engine • Monthly Earnings • Kotlin Android &amp; SQLite</text>
</svg>
