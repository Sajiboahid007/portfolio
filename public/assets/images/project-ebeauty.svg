<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="ebGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ebCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#210d1b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090a16" stop-opacity="0.95" />
    </linearGradient>
    <filter id="ebGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#0c0914" rx="16"/>
  <rect x="2" y="2" width="596" height="346" fill="url(#ebCardGrad)" rx="14" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle grid lines -->
  <g stroke="#371a32" stroke-width="1" stroke-opacity="0.35">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
  </g>

  <circle cx="210" cy="120" r="80" fill="#f43f5e" opacity="0.08" filter="url(#ebGlow)"/>

  <!-- Left: Beauty Product Showcase Card & Cart -->
  <g transform="translate(70, 35)">
    <rect x="0" y="0" width="225" height="175" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.2"/>
    
    <!-- Store Header -->
    <rect x="10" y="10" width="205" height="24" rx="4" fill="#380d28" fill-opacity="0.5"/>
    <text x="18" y="26" font-family="Outfit, sans-serif" font-size="10" font-weight="bold" fill="#fbcfe8">E-Beauty Store</text>
    
    <!-- Shopping Cart Icon with badge -->
    <rect x="175" y="14" width="30" height="16" rx="4" fill="#f43f5e"/>
    <text x="190" y="25" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">🛒 3</text>

    <!-- Product Item Preview -->
    <g transform="translate(10, 42)">
      <!-- Cosmetic bottle / perfume vector -->
      <rect x="0" y="0" width="60" height="70" rx="6" fill="#1e1b4b" stroke="#ec4899" stroke-width="0.8"/>
      <path d="M 25 15 L 35 15 L 35 22 L 25 22 Z M 20 22 L 40 22 L 44 55 L 16 55 Z" fill="url(#ebGrad)"/>
      <circle cx="30" cy="38" r="4" fill="#ffffff" opacity="0.8"/>

      <g transform="translate(68, 4)">
        <text x="0" y="14" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#f8fafc">Radiance Glow Serum</text>
        <text x="0" y="26" font-family="Inter, sans-serif" font-size="7.5" fill="#f472b6">★★★★★ (4.9/5)</text>
        <text x="0" y="42" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold" fill="#38bdf8">৳ 1,450</text>
        <rect x="0" y="48" width="65" height="14" rx="3" fill="#047857" fill-opacity="0.3"/>
        <text x="32" y="58" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="bold" fill="#34d399" text-anchor="middle">IN STOCK</text>
      </g>
    </g>

    <!-- Bottom Add to Cart & Filter -->
    <g transform="translate(10, 122)">
      <rect x="0" y="0" width="205" height="42" rx="6" fill="#1e293b"/>
      <text x="8" y="16" font-family="Inter, sans-serif" font-size="7.5" fill="#94a3b8">Filter: Skincare • Hair • Organic</text>
      <rect x="8" y="22" width="189" height="15" rx="3" fill="#f43f5e"/>
      <text x="102" y="32" font-family="Inter, sans-serif" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Add to Cart • Instant Checkout</text>
    </g>
  </g>

  <!-- Right: Real-time Order Tracking by ID Card -->
  <g transform="translate(315, 35)">
    <rect x="0" y="0" width="215" height="175" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
    
    <!-- Tracking ID Header -->
    <rect x="12" y="12" width="191" height="26" rx="4" fill="#312e81" fill-opacity="0.4"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#e0e7ff">LIVE ORDER TRACKING</text>
    <rect x="125" y="16" width="70" height="18" rx="3" fill="#4338ca"/>
    <text x="160" y="28" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#c7d2fe" text-anchor="middle">#EB-8921</text>

    <!-- Shipment Progress Milestones -->
    <g transform="translate(20, 48)">
      <!-- Line -->
      <line x1="12" y1="12" x2="12" y2="92" stroke="#4338ca" stroke-width="2"/>

      <!-- Step 1: Order Placed -->
      <circle cx="12" cy="12" r="6" fill="#10b981"/>
      <text x="26" y="15" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#f8fafc">Order Confirmed</text>
      <text x="26" y="24" font-family="Inter, sans-serif" font-size="6.5" fill="#94a3b8">Aug 18 • 10:30 AM</text>

      <!-- Step 2: Packed -->
      <circle cx="12" cy="48" r="6" fill="#10b981"/>
      <text x="26" y="51" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#f8fafc">Dispatched &amp; Packed</text>
      <text x="26" y="60" font-family="Inter, sans-serif" font-size="6.5" fill="#94a3b8">Dhaka Warehouse Hub</text>

      <!-- Step 3: Out for Delivery (Active Pulse) -->
      <circle cx="12" cy="84" r="7" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
      <text x="26" y="86" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#fbbf24">Out for Delivery</text>
      <text x="26" y="96" font-family="Inter, sans-serif" font-size="6.5" fill="#fde68a">Rider: Savar Express</text>
    </g>

    <!-- Bottom Status Banner -->
    <rect x="12" y="148" width="191" height="18" rx="3" fill="#047857" fill-opacity="0.3"/>
    <text x="107" y="160" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#34d399" text-anchor="middle">DELIVERY ESTIMATE: TODAY 4 PM</text>
  </g>

  <!-- Footer Project Details -->
  <text x="300" y="278" font-family="Outfit, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">E-Beauty - Modern E-Commerce Platform</text>
  <text x="300" y="306" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Dynamic Beauty Catalog • Persistent Cart • Real-time Tracking ID • Angular &amp; Node.js</text>
</svg>
