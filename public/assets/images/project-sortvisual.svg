<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="svGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="svCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190d2e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080b16" stop-opacity="0.95" />
    </linearGradient>
    <filter id="svGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#080c18" rx="16"/>
  <rect x="2" y="2" width="596" height="346" fill="url(#svCardGrad)" rx="14" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle grid lines -->
  <g stroke="#332a4e" stroke-width="1" stroke-opacity="0.3">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
  </g>

  <circle cx="300" cy="120" r="85" fill="#8b5cf6" opacity="0.1" filter="url(#svGlow)"/>

  <!-- Visualizer Screen Frame -->
  <g transform="translate(80, 30)">
    <rect x="0" y="0" width="440" height="185" rx="12" fill="#0b0f19" stroke="#6366f1" stroke-width="1.2"/>
    
    <!-- Visualizer Top Toolbar -->
    <rect x="0" y="0" width="440" height="32" rx="12" fill="#1e1b4b" fill-opacity="0.7"/>
    <circle cx="20" cy="16" r="4" fill="#ef4444"/>
    <circle cx="34" cy="16" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="16" r="4" fill="#10b981"/>

    <!-- Algorithm Selector Pills in Toolbar -->
    <g transform="translate(80, 7)">
      <rect x="0" y="0" width="60" height="18" rx="4" fill="#4f46e5"/>
      <text x="30" y="12" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">QuickSort</text>

      <rect x="68" y="0" width="60" height="18" rx="4" fill="#1e293b"/>
      <text x="98" y="12" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">MergeSort</text>

      <rect x="136" y="0" width="60" height="18" rx="4" fill="#1e293b"/>
      <text x="166" y="12" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">BubbleSort</text>

      <rect x="204" y="0" width="68" height="18" rx="4" fill="#1e293b"/>
      <text x="238" y="12" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">SelectionSort</text>
    </g>

    <!-- Sorting Bars Chart Representation -->
    <g transform="translate(30, 48)">
      <!-- Baseline -->
      <line x1="0" y1="105" x2="380" y2="105" stroke="#334155" stroke-width="1.5"/>

      <!-- Bars with distinct heights & state colors -->
      <!-- Sorted section (Green) -->
      <rect x="10" y="70" width="18" height="35" rx="3" fill="#10b981"/>
      <text x="19" y="65" font-family="JetBrains Mono, monospace" font-size="7" fill="#34d399" text-anchor="middle">12</text>

      <rect x="36" y="55" width="18" height="50" rx="3" fill="#10b981"/>
      <text x="45" y="50" font-family="JetBrains Mono, monospace" font-size="7" fill="#34d399" text-anchor="middle">24</text>

      <rect x="62" y="42" width="18" height="63" rx="3" fill="#10b981"/>
      <text x="71" y="37" font-family="JetBrains Mono, monospace" font-size="7" fill="#34d399" text-anchor="middle">38</text>

      <!-- Active Comparing / Swapping (Yellow / Amber) -->
      <rect x="88" y="25" width="18" height="80" rx="3" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="97" y="20" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#fbbf24" text-anchor="middle">65</text>
      <!-- Pointer [i] -->
      <text x="97" y="118" font-family="JetBrains Mono, monospace" font-size="8" font-weight="bold" fill="#fbbf24" text-anchor="middle">↑ [i]</text>

      <rect x="114" y="60" width="18" height="45" rx="3" fill="#6366f1"/>
      <text x="123" y="55" font-family="JetBrains Mono, monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">29</text>

      <!-- Pivot Element (Cyan Glow) -->
      <rect x="140" y="15" width="18" height="90" rx="3" fill="#06b6d4" stroke="#67e8f9" stroke-width="1.5"/>
      <text x="149" y="10" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#67e8f9" text-anchor="middle">88</text>
      <!-- Pointer [Pivot] -->
      <text x="149" y="118" font-family="JetBrains Mono, monospace" font-size="8" font-weight="bold" fill="#67e8f9" text-anchor="middle">★ [P]</text>

      <rect x="166" y="35" width="18" height="70" rx="3" fill="#6366f1"/>
      <text x="175" y="30" font-family="JetBrains Mono, monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">54</text>

      <!-- Active Comparing Element [j] (Rose/Amber) -->
      <rect x="192" y="20" width="18" height="85" rx="3" fill="#ec4899" stroke="#f472b6" stroke-width="1.5"/>
      <text x="201" y="15" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#f472b6" text-anchor="middle">72</text>
      <!-- Pointer [j] -->
      <text x="201" y="118" font-family="JetBrains Mono, monospace" font-size="8" font-weight="bold" fill="#f472b6" text-anchor="middle">↑ [j]</text>

      <rect x="218" y="48" width="18" height="57" rx="3" fill="#6366f1"/>
      <text x="227" y="43" font-family="JetBrains Mono, monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">41</text>

      <rect x="244" y="30" width="18" height="75" rx="3" fill="#6366f1"/>
      <text x="253" y="25" font-family="JetBrains Mono, monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">61</text>

      <rect x="270" y="10" width="18" height="95" rx="3" fill="#6366f1"/>
      <text x="279" y="5" font-family="JetBrains Mono, monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">95</text>

      <rect x="296" y="65" width="18" height="40" rx="3" fill="#6366f1"/>
      <text x="305" y="60" font-family="JetBrains Mono, monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">20</text>

      <rect x="322" y="40" width="18" height="65" rx="3" fill="#6366f1"/>
      <text x="331" y="35" font-family="JetBrains Mono, monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">48</text>

      <rect x="348" y="75" width="18" height="30" rx="3" fill="#6366f1"/>
      <text x="357" y="70" font-family="JetBrains Mono, monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">15</text>
    </g>
  </g>

  <!-- Footer Project Details -->
  <text x="300" y="278" font-family="Outfit, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">SortVisual - CS Algorithm Visualizer</text>
  <text x="300" y="306" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Interactive Step-by-Step Sorting • Bar Comparisons &amp; Swaps • Bubble, Merge &amp; QuickSort</text>
</svg>
