<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#avatarGrad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Subtle Grid Pattern in Avatar -->
  <g opacity="0.15" stroke="#818cf8" stroke-width="1">
    <line x1="50" y1="100" x2="350" y2="100" />
    <line x1="50" y1="200" x2="350" y2="200" />
    <line x1="50" y1="300" x2="350" y2="300" />
    <line x1="100" y1="50" x2="100" y2="350" />
    <line x1="200" y1="50" x2="200" y2="350" />
    <line x1="300" y1="50" x2="300" y2="350" />
  </g>

  <!-- Developer Silhouette / Modern Avatar Graphic -->
  <!-- Head -->
  <circle cx="200" cy="155" r="55" fill="url(#avatarGrad)" />
  
  <!-- Shoulders & Torso -->
  <path d="M 105 320 C 105 240, 140 225, 200 225 C 260 225, 295 240, 295 320 Z" fill="url(#avatarGrad)" opacity="0.9" />

  <!-- Stylish Glasses -->
  <rect x="160" y="145" width="30" height="18" rx="5" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
  <rect x="210" y="145" width="30" height="18" rx="5" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
  <line x1="190" y1="154" x2="210" y2="154" stroke="#ffffff" stroke-width="3" />

  <!-- Code Symbol Floating Badge -->
  <rect x="270" y="270" width="80" height="40" rx="20" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
  <text x="310" y="295" font-family="JetBrains Mono, monospace" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>

  <!-- Clear Photo Replacement Guidance Label -->
  <rect x="80" y="340" width="240" height="30" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" />
  <text x="200" y="360" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">📷 Photo Placeholder (Click to Change)</text>
</svg>
