<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="umGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="umCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a30" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070d18" stop-opacity="0.95" />
    </linearGradient>
    <filter id="umGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#080f1e" rx="16"/>
  <rect x="2" y="2" width="596" height="346" fill="url(#umCardGrad)" rx="14" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
  </g>

  <circle cx="300" cy="125" r="85" fill="#0ea5e9" opacity="0.1" filter="url(#umGlow)"/>

  <!-- Android Phone Mockup Frame -->
  <g transform="translate(130, 35)">
    <rect x="0" y="0" width="115" height="175" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Phone top notch -->
    <rect x="38" y="5" width="40" height="4" rx="2" fill="#334155"/>
    
    <!-- App Header inside phone -->
    <rect x="8" y="15" width="99" height="24" rx="4" fill="#0369a1"/>
    <text x="14" y="31" font-family="Outfit, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">UniMaterials</text>
    <circle cx="95" cy="27" r="4" fill="#38bdf8"/>

    <!-- Course Categories List in Phone -->
    <g transform="translate(8, 45)">
      <!-- Course 1 -->
      <rect x="0" y="0" width="99" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect x="4" y="4" width="14" height="14" rx="3" fill="#ef4444" fill-opacity="0.3"/>
      <text x="8" y="14" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#f87171">PDF</text>
      <text x="23" y="11" font-family="Inter, sans-serif" font-size="7" font-weight="bold" fill="#f8fafc">CSE-401 Lecture Notes</text>
      <text x="23" y="18" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8">Semester 8 • 4.2 MB</text>

      <!-- Course 2 -->
      <rect x="0" y="26" width="99" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect x="4" y="30" width="14" height="14" rx="3" fill="#0284c7" fill-opacity="0.3"/>
      <text x="7" y="40" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#38bdf8">DOC</text>
      <text x="23" y="37" font-family="Inter, sans-serif" font-size="7" font-weight="bold" fill="#f8fafc">Algorithms Syllabus</text>
      <text x="23" y="44" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8">Mid-term Exam Prep</text>

      <!-- Course 3 -->
      <rect x="0" y="52" width="99" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect x="4" y="56" width="14" height="14" rx="3" fill="#10b981" fill-opacity="0.3"/>
      <text x="8" y="66" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#34d399">PPT</text>
      <text x="23" y="63" font-family="Inter, sans-serif" font-size="7" font-weight="bold" fill="#f8fafc">Operating Systems Slides</text>
      <text x="23" y="70" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8">Faculty Published</text>

      <!-- Course 4 -->
      <rect x="0" y="78" width="99" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect x="4" y="82" width="14" height="14" rx="3" fill="#a855f7" fill-opacity="0.3"/>
      <text x="8" y="92" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#c084fc">ZIP</text>
      <text x="23" y="89" font-family="Inter, sans-serif" font-size="7" font-weight="bold" fill="#f8fafc">Lab Assignments &amp; Code</text>
      <text x="23" y="96" font-family="Inter, sans-serif" font-size="6" fill="#94a3b8">Complete Resource Pack</text>
    </g>
  </g>

  <!-- Side Feature Cards: Offline PDF & Kotlin/Firebase -->
  <g transform="translate(265, 45)">
    <!-- PDF Card -->
    <rect x="0" y="0" width="205" height="65" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="12" y="14" width="36" height="36" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
    <path d="M 24 23 L 36 23 L 36 41 L 24 41 Z" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <path d="M 30 28 L 30 36 M 27 33 L 30 36 L 33 33" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
    
    <text x="56" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Offline PDF Cache &amp; Viewer</text>
    <text x="56" y="42" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">One-tap downloads with local indexing</text>
    <rect x="56" y="48" width="60" height="12" rx="3" fill="#0369a1" fill-opacity="0.4"/>
    <text x="86" y="57" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">INSTANT ACCESS</text>
  </g>

  <g transform="translate(265, 120)">
    <!-- Android Kotlin & Firebase Card -->
    <rect x="0" y="0" width="205" height="65" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <rect x="12" y="14" width="36" height="36" rx="6" fill="#7c3aed" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
    <text x="30" y="37" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">K</text>
    
    <text x="56" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Native Android SDK &amp; Firebase</text>
    <text x="56" y="42" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Real-time cloud sync &amp; teacher channel</text>
    <rect x="56" y="48" width="75" height="12" rx="3" fill="#581c87" fill-opacity="0.5"/>
    <text x="93" y="57" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#d8b4fe" text-anchor="middle">KOTLIN NATIVE</text>
  </g>

  <!-- Footer Project Details -->
  <text x="300" y="278" font-family="Outfit, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">UniMaterials Course Sharing Platform</text>
  <text x="300" y="306" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Kotlin Android App • Semester Course PDFs • Cloud Notes Sync • Material Design</text>
</svg>
