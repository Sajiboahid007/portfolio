<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="cantCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1219" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95" />
    </linearGradient>
    <filter id="cantGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#0c1017" rx="16"/>
  <rect x="2" y="2" width="596" height="346" fill="url(#cantCardGrad)" rx="14" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.25">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
  </g>

  <circle cx="200" cy="120" r="75" fill="#f97316" opacity="0.08" filter="url(#cantGlow)"/>

  <!-- Left: Live Table Status Grid -->
  <g transform="translate(70, 35)">
    <rect x="0" y="0" width="225" height="175" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Table Grid Header -->
    <rect x="10" y="10" width="205" height="24" rx="4" fill="#1e293b"/>
    <text x="18" y="26" font-family="Inter, sans-serif" font-size="9.5" font-weight="bold" fill="#f8fafc">CANTEEN TABLE FLOOR MAP</text>
    <circle cx="195" cy="22" r="4" fill="#22c55e"/>

    <!-- 4 Table Blocks -->
    <!-- Table 01 (Occupied) -->
    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="98" height="56" rx="6" fill="#450a0a" fill-opacity="0.5" stroke="#ef4444" stroke-width="1"/>
      <text x="8" y="18" font-family="Outfit, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Table 01</text>
      <rect x="46" y="8" width="46" height="14" rx="3" fill="#ef4444" fill-opacity="0.3"/>
      <text x="69" y="18" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">OCCUPIED</text>
      <text x="8" y="34" font-family="Inter, sans-serif" font-size="7.5" fill="#fecaca">Order #84 • 3 Items</text>
      <text x="8" y="47" font-family="JetBrains Mono, monospace" font-size="8" font-weight="bold" fill="#fb923c">৳ 420.00</text>
    </g>

    <!-- Table 02 (Available) -->
    <g transform="translate(117, 42)">
      <rect x="0" y="0" width="98" height="56" rx="6" fill="#052e16" fill-opacity="0.5" stroke="#22c55e" stroke-width="1"/>
      <text x="8" y="18" font-family="Outfit, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Table 02</text>
      <rect x="46" y="8" width="46" height="14" rx="3" fill="#22c55e" fill-opacity="0.25"/>
      <text x="69" y="18" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="bold" fill="#86efac" text-anchor="middle">AVAILABLE</text>
      <text x="8" y="34" font-family="Inter, sans-serif" font-size="7.5" fill="#86efac">Ready for guest</text>
      <text x="8" y="47" font-family="JetBrains Mono, monospace" font-size="7" fill="#4ade80">Capacity: 4 Chairs</text>
    </g>

    <!-- Table 03 (Occupied) -->
    <g transform="translate(10, 106)">
      <rect x="0" y="0" width="98" height="56" rx="6" fill="#450a0a" fill-opacity="0.5" stroke="#ef4444" stroke-width="1"/>
      <text x="8" y="18" font-family="Outfit, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Table 03</text>
      <rect x="46" y="8" width="46" height="14" rx="3" fill="#ef4444" fill-opacity="0.3"/>
      <text x="69" y="18" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">OCCUPIED</text>
      <text x="8" y="34" font-family="Inter, sans-serif" font-size="7.5" fill="#fecaca">Order #85 • 2 Items</text>
      <text x="8" y="47" font-family="JetBrains Mono, monospace" font-size="8" font-weight="bold" fill="#fb923c">৳ 280.00</text>
    </g>

    <!-- Table 04 (Available) -->
    <g transform="translate(117, 106)">
      <rect x="0" y="0" width="98" height="56" rx="6" fill="#052e16" fill-opacity="0.5" stroke="#22c55e" stroke-width="1"/>
      <text x="8" y="18" font-family="Outfit, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Table 04</text>
      <rect x="46" y="8" width="46" height="14" rx="3" fill="#22c55e" fill-opacity="0.25"/>
      <text x="69" y="18" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="bold" fill="#86efac" text-anchor="middle">AVAILABLE</text>
      <text x="8" y="34" font-family="Inter, sans-serif" font-size="7.5" fill="#86efac">Ready for guest</text>
      <text x="8" y="47" font-family="JetBrains Mono, monospace" font-size="7" fill="#4ade80">Capacity: 6 Chairs</text>
    </g>
  </g>

  <!-- Right: Food Menu Order & POS Bill Card -->
  <g transform="translate(315, 35)">
    <rect x="0" y="0" width="215" height="175" rx="10" fill="#0f172a" stroke="#f97316" stroke-width="1.2"/>
    
    <!-- Order Header -->
    <rect x="12" y="12" width="191" height="24" rx="4" fill="#7c2d12" fill-opacity="0.4"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#fed7aa">Active POS Order • Table 01</text>

    <!-- Order items -->
    <g transform="translate(12, 44)">
      <rect x="0" y="0" width="191" height="20" rx="3" fill="#1e293b"/>
      <text x="8" y="14" font-family="Inter, sans-serif" font-size="7.5" fill="#f8fafc">1x Chicken Khichuri Platter</text>
      <text x="145" y="14" font-family="JetBrains Mono, monospace" font-size="7.5" fill="#fdba74">৳ 220</text>

      <rect x="0" y="24" width="191" height="20" rx="3" fill="#1e293b"/>
      <text x="8" y="38" font-family="Inter, sans-serif" font-size="7.5" fill="#f8fafc">2x Special Milk Tea</text>
      <text x="145" y="38" font-family="JetBrains Mono, monospace" font-size="7.5" fill="#fdba74">৳ 60</text>

      <rect x="0" y="48" width="191" height="20" rx="3" fill="#1e293b"/>
      <text x="8" y="62" font-family="Inter, sans-serif" font-size="7.5" fill="#f8fafc">1x Egg Beef Cutlet</text>
      <text x="145" y="62" font-family="JetBrains Mono, monospace" font-size="7.5" fill="#fdba74">৳ 140</text>
    </g>

    <!-- Total Bill Settlement Button -->
    <g transform="translate(12, 120)">
      <rect x="0" y="0" width="191" height="42" rx="6" fill="#ea580c" fill-opacity="0.25" stroke="#f97316" stroke-width="1"/>
      <text x="10" y="18" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#ffedd5">Total Payable: ৳ 420.00</text>
      <text x="10" y="32" font-family="Inter, sans-serif" font-size="7.5" fill="#fdba74">Auto-release Table upon Payment</text>
      
      <rect x="132" y="8" width="50" height="24" rx="4" fill="#f97316"/>
      <text x="157" y="24" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">PAID &amp; FREE</text>
    </g>
  </g>

  <!-- Footer Project Details -->
  <text x="300" y="278" font-family="Outfit, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">Canteen Table &amp; Order Management System</text>
  <text x="300" y="306" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Live Occupied/Available Status • Food Menu Ordering • POS Billing • Node.js &amp; SQL Server</text>
</svg>
