  <text x="300" y="280" font-family="Outfit, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">AlgoVision CS Algorithm Visualizer</text>
  <text x="300" y="310" font-family="Inter, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Dijkstra • A* Search • Sorting Trees • Canvas</text>
