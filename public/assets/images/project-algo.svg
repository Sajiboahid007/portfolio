<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#090d16" rx="16"/>
  <rect x="2" y="2" width="596" height="346" fill="#1e1b4b" fill-opacity="0.3" rx="14" stroke="#ec4899" stroke-width="2" stroke-dasharray="6 6"/>
  
