<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="beGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="beCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062524" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090f1d" stop-opacity="0.95" />
    </linearGradient>
    <filter id="beGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#071118" rx="16"/>
  <rect x="2" y="2" width="596" height="346" fill="url(#beCardGrad)" rx="14" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e3a47" stroke-width="1" stroke-opacity="0.3">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
  </g>

  <circle cx="300" cy="120" r="85" fill="#10b981" opacity="0.08" filter="url(#beGlow)"/>

  <!-- 3-in-1 Business Cards Container -->
  <!-- Card 1: Cable & ISP Billing -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="145" height="165" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>
    <rect x="10" y="10" width="28" height="28" rx="6" fill="#0284c7" fill-opacity="0.25"/>
    <!-- Antenna / ISP icon -->
    <path d="M 24 16 L 24 32 M 18 20 Q 24 16 30 20 M 15 24 Q 24 20 33 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    
    <text x="44" y="22" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#f8fafc">Cable / ISP</text>
    <text x="44" y="32" font-family="Inter, sans-serif" font-size="7.5" fill="#94a3b8">Subscriber Bills</text>

    <!-- Mini ledger row -->
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="125" height="24" rx="4" fill="#1e293b"/>
      <text x="6" y="15" font-family="Inter, sans-serif" font-size="7" fill="#cbd5e1">Sub: Karim Hossain</text>
      <text x="85" y="15" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#38bdf8">৳ 800</text>

      <rect x="0" y="28" width="125" height="24" rx="4" fill="#1e293b"/>
      <text x="6" y="43" font-family="Inter, sans-serif" font-size="7" fill="#cbd5e1">Sub: Faruk Mia</text>
      <text x="85" y="43" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#38bdf8">৳ 500</text>

      <rect x="0" y="56" width="125" height="24" rx="4" fill="#1e293b"/>
      <text x="6" y="71" font-family="Inter, sans-serif" font-size="7" fill="#cbd5e1">Due Date: 10th</text>
      <rect x="75" y="60" width="45" height="15" rx="3" fill="#047857" fill-opacity="0.4"/>
      <text x="97" y="71" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="bold" fill="#34d399" text-anchor="middle">PAID</text>
    </g>

    <rect x="10" y="138" width="125" height="18" rx="4" fill="#0369a1" fill-opacity="0.3"/>
    <text x="72" y="150" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#7dd3fc" text-anchor="middle">ISP MODULE</text>
  </g>

  <!-- Card 2: Tuition Fee Tracker -->
  <g transform="translate(225, 40)">
    <rect x="0" y="0" width="150" height="165" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <rect x="10" y="10" width="28" height="28" rx="6" fill="#4338ca" fill-opacity="0.25"/>
    <!-- Student / Graduation Cap icon -->
    <path d="M 24 18 L 32 22 L 24 26 L 16 22 Z" fill="#818cf8"/>
    <path d="M 18 24 L 18 29 C 18 31 30 31 30 29 L 30 24" fill="none" stroke="#818cf8" stroke-width="1.2"/>
    
    <text x="44" y="22" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#f8fafc">Tuition Tracker</text>
    <text x="44" y="32" font-family="Inter, sans-serif" font-size="7.5" fill="#94a3b8">Private Tutors</text>

    <!-- Mini ledger row -->
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="130" height="24" rx="4" fill="#1e293b"/>
      <text x="6" y="15" font-family="Inter, sans-serif" font-size="7" fill="#cbd5e1">Tanvir (Class 10)</text>
      <text x="90" y="15" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#a78bfa">৳ 3,000</text>

      <rect x="0" y="28" width="130" height="24" rx="4" fill="#1e293b"/>
      <text x="6" y="43" font-family="Inter, sans-serif" font-size="7" fill="#cbd5e1">Suma (Class 8)</text>
      <text x="90" y="43" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#a78bfa">৳ 2,500</text>

      <rect x="0" y="56" width="130" height="24" rx="4" fill="#1e293b"/>
      <text x="6" y="71" font-family="Inter, sans-serif" font-size="7" fill="#cbd5e1">Monthly Total</text>
      <rect x="80" y="60" width="45" height="15" rx="3" fill="#312e81" fill-opacity="0.6"/>
      <text x="102" y="71" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="bold" fill="#c7d2fe" text-anchor="middle">৳ 5,500</text>
    </g>

    <rect x="10" y="138" width="130" height="18" rx="4" fill="#4338ca" fill-opacity="0.3"/>
    <text x="75" y="150" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#c7d2fe" text-anchor="middle">TUITION MODULE</text>
  </g>

  <!-- Card 3: Grocery Due / Khata Ledger -->
  <g transform="translate(395, 40)">
    <rect x="0" y="0" width="145" height="165" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect x="10" y="10" width="28" height="28" rx="6" fill="#065f46" fill-opacity="0.3"/>
    <!-- Store / Khata icon -->
    <path d="M 16 20 L 32 20 L 30 30 L 18 30 Z M 21 20 L 21 16 Q 24 14 27 16 L 27 20" fill="none" stroke="#34d399" stroke-width="1.2"/>
    
    <text x="44" y="22" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#f8fafc">Grocery Khata</text>
    <text x="44" y="32" font-family="Inter, sans-serif" font-size="7.5" fill="#94a3b8">Baki / Due Ledger</text>

    <!-- Mini ledger row -->
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="125" height="24" rx="4" fill="#1e293b"/>
      <text x="6" y="15" font-family="Inter, sans-serif" font-size="7" fill="#cbd5e1">Babul Mia (Due)</text>
      <text x="85" y="15" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#f87171">-৳ 450</text>

      <rect x="0" y="28" width="125" height="24" rx="4" fill="#1e293b"/>
      <text x="6" y="43" font-family="Inter, sans-serif" font-size="7" fill="#cbd5e1">Salam Bhai</text>
      <text x="85" y="43" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#34d399">+৳ 1,200</text>

      <rect x="0" y="56" width="125" height="24" rx="4" fill="#1e293b"/>
      <text x="6" y="71" font-family="Inter, sans-serif" font-size="7" fill="#cbd5e1">Offline SQLite</text>
      <rect x="75" y="60" width="45" height="15" rx="3" fill="#065f46" fill-opacity="0.4"/>
      <text x="97" y="71" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="bold" fill="#34d399" text-anchor="middle">SYNCED</text>
    </g>

    <rect x="10" y="138" width="125" height="18" rx="4" fill="#047857" fill-opacity="0.3"/>
    <text x="72" y="150" font-family="JetBrains Mono, monospace" font-size="7" font-weight="bold" fill="#6ee7b7" text-anchor="middle">GROCERY LEDGER</text>
  </g>

  <!-- Footer Project Details -->
  <text x="300" y="278" font-family="Outfit, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">BillEasy - Multi-Business Billing &amp; Due Ledger</text>
  <text x="300" y="306" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Cable/ISP Billing • Private Tuition Fee Tracker • Grocery Shop Khata • Kotlin &amp; SQLite</text>
</svg>
