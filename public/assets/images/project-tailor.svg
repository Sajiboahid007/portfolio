<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="tailorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tailorCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18151f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0a0d17" stop-opacity="0.95" />
    </linearGradient>
    <filter id="tailorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#0b0f19" rx="16"/>
  <rect x="2" y="2" width="596" height="346" fill="url(#tailorCardGrad)" rx="14" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.2">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
  </g>

  <circle cx="210" cy="120" r="70" fill="#f59e0b" opacity="0.08" filter="url(#tailorGlow)"/>

  <!-- Garment / Suit Silhouette with Measuring Points -->
  <g transform="translate(100, 35)">
    <!-- Measuring Tape Border / Backdrop -->
    <rect x="0" y="0" width="165" height="175" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    
    <!-- Header with Scissors & Tape Icon -->
    <rect x="12" y="10" width="141" height="24" rx="4" fill="#1e293b"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#fbbf24">MEASUREMENT CARD</text>
    <circle cx="140" cy="22" r="4" fill="#f59e0b"/>

    <!-- Suit / Clothing Vector Silhouette -->
    <g transform="translate(20, 42)">
      <!-- Collar & Jacket Outline -->
      <path d="M 35 15 L 45 35 L 20 40 L 10 95 L 35 95 L 35 50 L 50 50 L 50 95 L 75 95 L 65 40 L 40 35 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M 42 15 L 42 35" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Measurement Tape Pins -->
      <!-- Chest Pin -->
      <circle cx="20" cy="45" r="3" fill="#38bdf8"/>
      <line x1="23" y1="45" x2="65" y2="45" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="65" cy="45" r="3" fill="#38bdf8"/>
      
      <!-- Waist Pin -->
      <circle cx="23" cy="70" r="3" fill="#34d399"/>
      <line x1="26" y1="70" x2="62" y2="70" stroke="#34d399" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="62" cy="70" r="3" fill="#34d399"/>

      <!-- Measurement values indicator -->
      <g transform="translate(85, 5)">
        <text x="0" y="20" font-family="JetBrains Mono, monospace" font-size="8" fill="#38bdf8">Chest: 40"</text>
        <text x="0" y="35" font-family="JetBrains Mono, monospace" font-size="8" fill="#34d399">Waist: 34"</text>
        <text x="0" y="50" font-family="JetBrains Mono, monospace" font-size="8" fill="#fbbf24">Length: 38"</text>
        <text x="0" y="65" font-family="JetBrains Mono, monospace" font-size="8" fill="#c084fc">Sleeve: 25"</text>
      </g>
    </g>

    <!-- Bottom Customer Label -->
    <rect x="12" y="145" width="141" height="20" rx="4" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="0.8"/>
    <text x="20" y="158" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#34d399">Customer: Rafiq Ahmed</text>
  </g>

  <!-- Right Side Order Details & CRUD Management Card -->
  <g transform="translate(285, 35)">
    <!-- Order Profile Card -->
    <rect x="0" y="0" width="215" height="175" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
    
    <!-- Order Card Header -->
    <rect x="12" y="12" width="191" height="24" rx="4" fill="#312e81" fill-opacity="0.4"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#e0e7ff">Order #TLR-1048</text>
    <rect x="135" y="15" width="60" height="18" rx="4" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="165" y="27" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="bold" fill="#fbbf24" text-anchor="middle">IN PROGRESS</text>

    <!-- Order Items Summary -->
    <g transform="translate(12, 45)">
      <rect x="0" y="0" width="191" height="24" rx="4" fill="#1e293b"/>
      <text x="8" y="15" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#f8fafc">Item: 2-Piece Safari Suit</text>
      <text x="145" y="15" font-family="JetBrains Mono, monospace" font-size="8" fill="#38bdf8">Qty: 01</text>

      <rect x="0" y="28" width="191" height="24" rx="4" fill="#1e293b"/>
      <text x="8" y="43" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#f8fafc">Delivery: 24 Aug 2025</text>
      <text x="140" y="43" font-family="JetBrains Mono, monospace" font-size="8" fill="#34d399">৳ 2,400</text>
    </g>

    <!-- CRUD & Database Badges -->
    <g transform="translate(12, 110)">
      <rect x="0" y="0" width="191" height="52" rx="6" fill="#1e1b4b" fill-opacity="0.5" stroke="#4338ca" stroke-width="0.8"/>
      <text x="10" y="18" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#c7d2fe">Milestone First Web Project</text>
      <text x="10" y="32" font-family="Inter, sans-serif" font-size="7.5" fill="#94a3b8">Customer CRUD • Size Profiles • Order History</text>
      
      <!-- Tech tags -->
      <rect x="10" y="37" width="45" height="11" rx="2" fill="#312e81"/>
      <text x="32" y="45" font-family="JetBrains Mono, monospace" font-size="6" fill="#e0e7ff" text-anchor="middle">JavaScript</text>

      <rect x="60" y="37" width="45" height="11" rx="2" fill="#065f46"/>
      <text x="82" y="45" font-family="JetBrains Mono, monospace" font-size="6" fill="#a7f3d0" text-anchor="middle">Bootstrap</text>

      <rect x="110" y="37" width="40" height="11" rx="2" fill="#0369a1"/>
      <text x="130" y="45" font-family="JetBrains Mono, monospace" font-size="6" fill="#bae6fd" text-anchor="middle">MySQL</text>
    </g>
  </g>

  <!-- Footer Project Details -->
  <text x="300" y="278" font-family="Outfit, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">Tailor Shop Order &amp; Measurement System</text>
  <text x="300" y="306" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Custom Size Dimensions • Order Delivery Status • JavaScript, Bootstrap &amp; MySQL</text>
</svg>
