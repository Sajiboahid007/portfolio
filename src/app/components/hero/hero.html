<section id="home" class="relative min-h-screen pt-32 pb-20 flex items-center justify-center overflow-hidden">
  <!-- Background Ambient Glow Effects -->
  <div class="ambient-glow glow-primary -top-20 -left-20"></div>
  <div class="ambient-glow glow-cyan top-1/3 -right-20"></div>
  <div class="ambient-glow glow-purple bottom-10 left-1/4"></div>

  <div class="container mx-auto relative z-10">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
      
      <!-- Left Column: Introduction & CTA -->
      <div class="lg:col-span-7 flex flex-col items-start text-left">
        
        <!-- Status Pill -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-subtle bg-surface-elevated mb-6 shadow-sm">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          <span class="text-xs font-mono text-muted tracking-wide">Available for Full-Time Roles & Projects</span>
        </div>

        <!-- Main Heading -->
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight mb-4 leading-tight font-display">
          Hi, I'm <span class="gradient-text">{{ data.name }}</span>
        </h1>

        <!-- Typewriter Animated Subheading with clear space after "I am a" -->
        <div class="typewriter-container flex items-center min-h-[3.2rem] text-xl sm:text-2xl md:text-3xl font-semibold text-muted mb-6 font-display">
          <span class="typewriter-prefix text-main">I am a&nbsp;</span>
          <span class="typewriter-text text-indigo-400 font-bold font-mono">{{ currentRoleText() }}</span>
          <span class="typewriter-cursor">|</span>
        </div>

        <!-- Short Tagline -->
        <p class="text-base sm:text-lg text-muted max-w-xl mb-8 leading-relaxed">
          {{ data.tagline }}
        </p>

        <!-- CTA Buttons with Generous Margins & Clear Gap before Mail -->
        <div class="btn-cta-group flex flex-wrap items-center gap-4 mb-10 w-full sm:w-auto">
          <button
            type="button"
            (click)="scrollTo('projects')"
            class="btn-primary-gradient px-6 py-3.5 text-sm sm:text-base font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 cursor-pointer transition-all hover:scale-[1.03]"
          >
            <i class="pi pi-folder text-base"></i>
            <span>View Projects</span>
          </button>

          <button
            type="button"
            (click)="downloadCV()"
            class="btn-outline-glass px-6 py-3.5 text-sm sm:text-base font-semibold rounded-xl flex items-center justify-center gap-2 cursor-pointer transition-all hover:scale-[1.03]"
          >
            <i class="pi pi-download text-base text-indigo-400"></i>
            <span>Download CV</span>
          </button>
          
          <button
            type="button"
            (click)="scrollTo('contact')"
            class="btn-mail-action p-3.5 rounded-xl border border-subtle bg-surface-elevated hover:border-indigo-400 transition-all text-main flex items-center justify-center cursor-pointer ml-1"
            pTooltip="Send Direct Message"
            tooltipPosition="bottom"
            [attr.aria-label]="'Contact ' + data.name"
          >
            <i class="pi pi-envelope text-lg text-cyan-400"></i>
          </button>
        </div>

        <!-- Social Channels & Quick Info -->
        <div class="pt-6 border-t border-subtle w-full flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <span class="text-xs font-mono text-muted uppercase tracking-wider">Connect:</span>
            
            <a
              [href]="data.github"
              target="_blank"
              rel="noopener noreferrer"
              class="social-icon-btn p-2 rounded-lg border border-subtle bg-surface-elevated hover:text-indigo-400 hover:border-indigo-400 transition-all cursor-pointer"
              aria-label="GitHub Profile"
              pTooltip="GitHub"
            >
              <i class="pi pi-github text-base"></i>
            </a>

            <a
              [href]="data.linkedin"
              target="_blank"
              rel="noopener noreferrer"
              class="social-icon-btn p-2 rounded-lg border border-subtle bg-surface-elevated hover:text-indigo-400 hover:border-indigo-400 transition-all cursor-pointer"
              aria-label="LinkedIn Profile"
              pTooltip="LinkedIn"
            >
              <i class="pi pi-linkedin text-base"></i>
            </a>

            <a
              [href]="'https://wa.me/' + data.whatsapp"
              target="_blank"
              rel="noopener noreferrer"
              class="social-icon-btn p-2 rounded-lg border border-subtle bg-surface-elevated hover:text-emerald-400 hover:border-emerald-400 transition-all cursor-pointer"
              aria-label="WhatsApp"
              pTooltip="WhatsApp"
            >
              <i class="pi pi-whatsapp text-base"></i>
            </a>

            <a
              [href]="'mailto:' + data.email"
              class="social-icon-btn p-2 rounded-lg border border-subtle bg-surface-elevated hover:text-cyan-400 hover:border-cyan-400 transition-all cursor-pointer"
              aria-label="Email"
              pTooltip="Send Email"
            >
              <i class="pi pi-send text-base"></i>
            </a>
          </div>

          <div class="flex items-center gap-2 font-mono text-xs text-muted">
            <i class="pi pi-map-marker text-indigo-400"></i>
            <span>{{ data.location }}</span>
          </div>
        </div>

      </div>

      <!-- Right Column: Profile Photo & Equal-Sized Clean Stats Cards -->
      <div class="lg:col-span-5 flex flex-col items-center justify-center">
        <div class="flex flex-col items-center w-full max-w-[310px]">
          
          <!-- Image Card Frame -->
          <div class="w-full rounded-3xl p-2.5 glass-card border border-indigo-500/30 glowing-avatar shadow-2xl">
            
            <!-- Main Photo Container -->
            <div class="relative w-full h-[310px] rounded-2xl overflow-hidden bg-slate-900 border border-subtle group">
              <img
                [src]="data.avatarUrl"
                [alt]="data.name"
                class="w-full h-full object-cover object-top transition-transform duration-500 group-hover:scale-105"
              />
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
              
              <!-- In-Card Clean Footer Badges -->
              <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between">
                <span class="px-2.5 py-1 rounded-lg text-[11px] font-mono font-bold bg-slate-950/90 backdrop-blur-md text-cyan-300 border border-cyan-500/40 flex items-center gap-1.5 shadow-lg">
                  <i class="pi pi-bolt text-[10px] text-cyan-400"></i>
                  <span>Angular & Full-Stack</span>
                </span>
                <span class="px-2.5 py-1 rounded-lg text-[11px] font-mono font-bold bg-slate-950/90 backdrop-blur-md text-indigo-300 border border-indigo-500/40 flex items-center gap-1 shadow-lg">
                  <i class="pi pi-graduation-cap text-[10px] text-indigo-400"></i>
                  <span>CSE Graduate</span>
                </span>
              </div>
            </div>

          </div>

          <!-- 3 Stats Cards - 100% Equal Size & Dimensions -->
          <div class="grid grid-cols-3 gap-3 mt-8 w-full">
            <div class="stat-box glass-card p-3 rounded-xl text-center flex flex-col items-center justify-center h-[76px]">
              <span class="block text-xl font-extrabold gradient-text font-display leading-tight">15+</span>
              <span class="text-[10px] text-muted font-mono uppercase tracking-wider mt-1">Projects</span>
            </div>
            <div class="stat-box glass-card p-3 rounded-xl text-center flex flex-col items-center justify-center h-[76px]">
              <span class="block text-xl font-extrabold gradient-text font-display leading-tight">150+</span>
              <span class="text-[10px] text-muted font-mono uppercase tracking-wider mt-1">Beecrowd</span>
            </div>
            <div class="stat-box glass-card p-3 rounded-xl text-center flex flex-col items-center justify-center h-[76px]">
              <span class="block text-xl font-extrabold gradient-text font-display leading-tight">3.51</span>
              <span class="text-[10px] text-muted font-mono uppercase tracking-wider mt-1">CGPA</span>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
